<!doctype html>
<!-- The link preview image (public/og.png, 1200x630), rendered by og/render.mjs (`npm run og`). The deck's dark green
     as a still gradient, the GRIDZILLA wordmark in Clash Display 600, the line in General Sans 400; nothing else. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Clash Display"; src: url("../public/fonts/ClashDisplay-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "General Sans"; src: url("../public/fonts/GeneralSans-400.woff2") format("woff2"); font-weight: 400; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(70% 90% at 18% 8%, rgb(11 93 61 / 0.9), transparent 70%),
      radial-gradient(55% 80% at 88% 30%, rgb(15 143 127 / 0.45), transparent 72%),
      radial-gradient(80% 70% at 45% 105%, rgb(6 38 28 / 0.95), transparent 70%),
      #040706;
    color: #f5f5f7;
    text-align: center;
  }
  h1 { margin: 0; font: 600 132px/1 "Clash Display", sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
  p { margin: 28px 0 0; font: 400 38px/1.3 "General Sans", sans-serif; letter-spacing: -0.01em; color: rgb(245 245 247 / 0.9); }
</style>
</head>
<body>
  <div>
    <h1>Gridzilla</h1>
    <p>One signed limit. The whole street listens.</p>
  </div>
</body>
</html>

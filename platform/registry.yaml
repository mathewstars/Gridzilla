# Gridzilla registry: the grid tree and the devices in the program.
# Tree nodes are "kind:name". Kinds top down: region, sub, feeder, tf.
# other_houses: houses on the transformer that are NOT in the program (synthetic background load for the board).
# represents: how many real houses one simulated device stands for on the board (penetration), default 1.

tree:
  region:at:        { parent: null }
  sub:wien-sued:       { parent: region:at,       rating_kw: 40000 }
  feeder:liesing-3:  { parent: sub:wien-sued,      rating_kw: 4000 }
  tf:atzgersdorf-1:    { parent: feeder:liesing-3, rating_kw: 250, reverse_kw: 250, other_houses: 45 }
  tf:mauer-2:     { parent: feeder:liesing-3, rating_kw: 400, reverse_kw: 400, other_houses: 70 }

devices:
  - id: vic-atzgersdorf-07      # the real Victron plant on VRM
    tf: tf:atzgersdorf-1
    vendor: victron
    kw: 10
    kwh: 15
    feedin_max_kw: 10
    represents: 10
  - id: sim-atzgersdorf-12
    tf: tf:atzgersdorf-1
    vendor: sim
    kw: 5
    kwh: 15
    feedin_max_kw: 5
    represents: 10
  - id: sim-atzgersdorf-19
    tf: tf:atzgersdorf-1
    vendor: sim
    kw: 8
    kwh: 20
    feedin_max_kw: 8
    represents: 10
  - id: sim-mauer-03
    tf: tf:mauer-2
    vendor: goodwe
    kw: 10
    kwh: 20
    feedin_max_kw: 10
    represents: 10
  - id: sim-mauer-08
    tf: tf:mauer-2
    vendor: sim
    kw: 5
    kwh: 10
    feedin_max_kw: 5
    represents: 10

policy:
  max_window_min: 240            # except STRETCH
  max_stretch_window_min: 4320   # 3 days
  max_support_per_node_per_day: 2
  max_export_min_kw_per_device: 5
  max_import_cap_floor_kw: 2     # never cap import below this
  heartbeat_s: 30
  ramp_s: [20, 90]
